name: flutter_installer
description: Flutter Installer is an installer for Flutter built with Flutter.
version: 0.0.8+8
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # stacked
  stacked: ^3.5.0

  # third-party services
  stacked_services: ^1.6.0

  # navigation
  auto_route: ^11.1.0

  # inversion of control
  get_it: ^8.3.0
  injectable: ^3.0.0

  # icons
  font_awesome_flutter: ^11.0.0

  # ui
  percent_indicator: ^4.2.5
  flutter_markdown: ^0.7.7+1
  theme_mode_builder: ^2.0.0

  # accesses filesystem
  process_run: ^1.3.4+1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # misc
  logger: ^2.7.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  file_selector: ^1.1.0
  file_selector_windows: ^0.9.3+5
  file_selector_macos: ^0.9.5
  file_selector_linux: ^0.9.4
  window_manager: ^0.5.2
  async: ^2.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generators
  build_runner: ^2.14.1
  auto_route_generator: ^10.4.0
  injectable_generator: ^3.1.1

  msix: 3.16.12
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/app_logos/
    - assets/misc/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono/RobotoMono-Bold.ttf
          weight: 700

msix_config:
  display_name: Flutter Installer
  publisher_display_name: Yazeed AlKhalaf
  publisher: CN=93334AAE-C29A-45CE-B580-55884CF74482
  identity_name: 51837YazeedAlKhalaf.FlutterInstaller
  msix_version: 0.0.8.0
  icons_background_color: transparent
  architecture: x64
  # See https://docs.microsoft.com/en-us/windows/uwp/packaging/app-capability-declarations
  capabilities: "internetClient"
